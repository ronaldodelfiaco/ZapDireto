<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Enviar WhatsApp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Enviar mensagem no WhatsApp</h1>

    <input 
      type="tel" 
      id="phone" 
      placeholder="Digite o número com DDD (ex: 11999999999)"
      maxlength="13"
    />

    <button onclick="sendWhatsApp()">Enviar</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
